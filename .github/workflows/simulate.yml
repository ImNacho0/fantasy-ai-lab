name: Fantasy AI Lab Simulation Runner

on:
  workflow_dispatch:
    inputs:
      leagues:
        description: 'Total number of leagues to simulate'
        required: true
        default: '5'
      matchdays:
        description: 'Number of matchdays per league'
        required: true
        default: '5'
      seed:
        description: 'Random seed for simulation reproducibility'
        required: true
        default: '123'
      extreme_matchday:
        description: 'Optional matchday to trigger extreme scenario (leave empty for none)'
        required: false
        default: ''
      extreme_scenario:
        description: 'Extreme scenario name'
        required: false
        default: 'STAR_PLAYER_INJURED'
  schedule:
    # Run once a day at midnight UTC (conservative schedule)
    - cron: '0 0 * * *'

jobs:
  simulate:
    name: Execute Autonomous Simulation
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Run Database Migrations
      run: |
        alembic upgrade head
      env:
        # Use SQLite for lightweight runner execution
        DATABASE_URL: sqlite:///fantasy_ai.db

    - name: Execute Simulation
      run: |
        # Build command based on inputs
        LEAGUES="${{ github.event.inputs.leagues || '5' }}"
        MATCHDAYS="${{ github.event.inputs.matchdays || '5' }}"
        SEED="${{ github.event.inputs.seed || '123' }}"
        EXTREME_MD="${{ github.event.inputs.extreme_matchday || '' }}"
        EXTREME_SCENARIO="${{ github.event.inputs.extreme_scenario || 'STAR_PLAYER_INJURED' }}"

        CMD="python -m fantasy_ai_lab.simulate --leagues $LEAGUES --matchdays $MATCHDAYS --seed $SEED"
        if [ ! -z "$EXTREME_MD" ]; then
          CMD="$CMD --extreme-matchday $EXTREME_MD --extreme-scenario $EXTREME_SCENARIO"
        fi

        echo "Running: $CMD"
        PYTHONPATH=src $CMD
      env:
        DATABASE_URL: sqlite:///fantasy_ai.db

    - name: Run Pytest Test Suite
      run: |
        PYTHONPATH=src pytest
      env:
        DATABASE_URL: sqlite:///fantasy_ai.db
