version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: fantasy_ai_db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: fantasy_ai_lab
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  api:
    build: .
    container_name: fantasy_ai_api
    restart: always
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://postgres:password@db:5432/fantasy_ai_lab
      - PORT=8000
      - ENV=development
    depends_on:
      - db

volumes:
  pgdata:
